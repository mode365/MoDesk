name: Flutter Nightly Build

on:
  # MoDesk: upstream ran a nightly schedule build; disabled — builds are
  # manual (this workflow / modesk-build.yml) or v* tag triggered only.
  workflow_dispatch:

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
